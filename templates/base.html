<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    nav { background: #1f3b64; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font-size: 15px; cursor: pointer; }
    nav .right { margin-left: auto; color: #cfd8e6; }
    main { max-width: 860px; margin: 28px auto; background: #fff; padding: 24px 32px; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eef2f7; }
    input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
    button.primary { background: #1f3b64; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
    .flash { padding: 10px; border-radius: 4px; margin-bottom: 14px; }
    .flash.error { background: #fde2e2; color: #8a1f1f; }
    .flash.success { background: #e1f5e5; color: #1d5e2a; }
  </style>
</head>
<body>
  {% if session.user_id %}
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('assignments') }}">Assignments</a>
    <a href="{{ url_for('messages') }}">Messages</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <span class="right">{{ session.username }} ({{ session.role }})</span>
    <form method="post" action="{{ url_for('logout') }}" style="margin:0">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button type="submit">Logout</button>
    </form>
  </nav>
  {% endif %}
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
